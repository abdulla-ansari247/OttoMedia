<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otto Media</title>
<link rel="icon" href="imgs/otto_logo_enhanced_transparent.png">
<style>
  :root {
    --bg: #eceded;
    --surface: #f5f6f6;
    --ink: #1c1c1e;
    --muted: #6b6f72;
    --line: #d8dadb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    background: radial-gradient(ellipse at 50% 0%, var(--surface), var(--bg) 70%);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #paint {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
  }

  .card {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .logo {
    width: 100%;
    max-width: 320px;
    height: auto;
    margin: 0 auto 40px;
    display: block;
    animation: rise 0.9s ease-out both;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1.3;
    animation: rise 0.9s ease-out 0.12s both;
  }

  p {
    margin: 20px auto 0;
    max-width: 38ch;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    animation: rise 0.9s ease-out 0.24s both;
  }

  .rule {
    width: 56px;
    height: 1px;
    margin: 36px auto 0;
    background: var(--line);
    animation: rise 0.9s ease-out 0.36s both;
  }

  .contact {
    margin-top: 32px;
    animation: rise 0.9s ease-out 0.48s both;
  }

  .contact h2 {
    margin: 0 0 16px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .contact ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px 28px;
  }

  .contact a {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink);
    font-size: 0.95rem;
    text-decoration: none;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    border-color: var(--ink);
    background: #fff;
    transform: translateY(-1px);
  }

  .contact svg {
    width: 16px;
    height: 16px;
    flex: none;
    fill: currentColor;
    color: var(--muted);
  }

  .contact a:hover svg,
  .contact a:focus-visible svg {
    color: var(--ink);
  }

  /* ---- Otto the cat ---------------------------------------------------- */

  .play-bar {
    margin-top: 28px;
    animation: rise 0.9s ease-out 0.6s both;
  }

  .play-bar ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .play-bar button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 15px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }

  .play-bar button:hover,
  .play-bar button:focus-visible {
    border-color: var(--ink);
    background: #fff;
    transform: translateY(-1px);
  }

  .play-bar button[aria-pressed="true"] {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--surface);
  }

  .hint {
    margin: 14px 0 0;
    min-height: 1.4em;
    font-size: 0.85rem;
    color: var(--muted);
    animation: none;
  }

  #cat-scene {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 126px;
    z-index: 2;
    pointer-events: none;
  }

  #cat {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 132px;
    pointer-events: auto;
    cursor: grab;
    will-change: transform;
  }

  #cat:active { cursor: grabbing; }

  .cat-svg {
    display: block;
    width: 132px;
    height: auto;
    overflow: visible;
  }

  /* Fur */
  .body, .head-shape, .leg, .ear { fill: #7b8388; }
  .tail { fill: none; stroke: #7b8388; stroke-width: 9; stroke-linecap: round; }
  .belly { fill: #b9c0c4; }
  .ear-in { fill: #c08e92; }
  .nose { fill: #c08e92; }
  .shade { fill: #1c1c1e; opacity: 0.09; }
  .eye-white { fill: #d9a441; }
  .pupil { fill: #22262a; }
  .glint { fill: #fff; }
  .mouth, .whiskers, .eye-shut {
    fill: none;
    stroke: #4d5459;
    stroke-width: 1.6;
    stroke-linecap: round;
  }
  .whiskers { stroke: #9aa1a5; stroke-width: 1.2; }
  .stripe { fill: none; stroke: #676f74; stroke-width: 4; stroke-linecap: round; }

  .eye-shut { opacity: 0; }
  #cat.shut .eye { opacity: 0; }
  #cat.shut .eye-shut { opacity: 1; }

  /* Pivots */
  .leg, .tail, .head { transform-box: fill-box; }
  .leg { transform-origin: 50% 8%; }
  .tail { transform-origin: 0% 100%; }
  .head { transform-origin: 50% 88%; }

  /* Idle life */
  .tail { animation: swish 2.6s ease-in-out infinite; }
  .cat-bob { animation: breathe 3.4s ease-in-out infinite; transform-origin: 50% 100%; }

  @keyframes swish {
    0%, 100% { transform: rotate(6deg); }
    50%      { transform: rotate(-11deg); }
  }

  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.018); }
  }

  /* Walking */
  #cat.walk .leg-f1, #cat.walk .leg-b2 { animation: step 0.42s linear infinite; }
  #cat.walk .leg-f2, #cat.walk .leg-b1 { animation: step 0.42s linear infinite -0.21s; }
  #cat.walk .cat-bob { animation: trot 0.42s ease-in-out infinite; }
  #cat.walk .tail { animation: swish 0.9s ease-in-out infinite; }

  @keyframes step {
    0%, 100% { transform: rotate(16deg); }
    50%      { transform: rotate(-16deg); }
  }

  @keyframes trot {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  /* Eating */
  #cat.eat .head { animation: munch 0.32s ease-in-out infinite; }
  #cat.eat .tail { animation: swish 1.4s ease-in-out infinite; }

  @keyframes munch {
    0%, 100% { transform: rotate(9deg) translateY(4px); }
    50%      { transform: rotate(15deg) translateY(9px); }
  }

  /* Purring */
  #cat.pet .cat-bob { animation: purr 0.19s ease-in-out infinite; }
  #cat.pet .head { animation: nuzzle 1.5s ease-in-out infinite; }
  #cat.pet .tail { animation: swish 3.4s ease-in-out infinite; }

  @keyframes purr {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(0.7px, -0.7px); }
  }

  @keyframes nuzzle {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-7deg) translateY(-2px); }
  }

  /* Hunting the string */
  #cat.play .tail { animation: flick 0.4s ease-in-out infinite; }

  @keyframes flick {
    0%, 100% { transform: rotate(-16deg); }
    50%      { transform: rotate(14deg); }
  }

  #cat.pounce .cat-bob { animation: pounce 0.52s cubic-bezier(.3,.7,.4,1); }

  @keyframes pounce {
    0%   { transform: translateY(0) rotate(0deg); }
    45%  { transform: translateY(-52px) rotate(-13deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  /* Napping */
  #cat.sleep .cat-bob { animation: breathe 2.6s ease-in-out infinite; }
  #cat.sleep .tail { animation: swish 6s ease-in-out infinite; }

  /* Bowl and string toy */
  #bowl {
    position: absolute;
    bottom: 4px;
    width: 58px;
    margin-left: -29px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  #bowl.out { opacity: 1; transform: translateY(0); }
  #bowl svg { display: block; width: 100%; height: auto; }
  .bowl-body { fill: #8a9196; }
  .bowl-rim  { fill: #6f767b; }
  .kibble    { fill: #b5813f; }

  #toy {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  #toy-string { stroke: #8d9499; stroke-width: 2; stroke-linecap: round; }
  .ball  { fill: #b5555f; }
  .ball-hi { fill: #d68b93; }

  /* Hearts, crumbs, sparkles, zzz */
  #fx {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
  }

  .bit {
    position: absolute;
    font-size: 15px;
    line-height: 1;
    color: #b5555f;
    animation: lift 1.1s ease-out forwards;
  }

  .bit.zzz { color: var(--muted); font-size: 13px; animation-duration: 2.2s; }
  .bit.crumb, .bit.spark {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #8a6a3a;
    animation: scatter 0.7s ease-out forwards;
  }
  .bit.spark { background: #d9a441; }

  @keyframes lift {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    22%  { opacity: 1; transform: translate(-50%, -60%) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -150%) scale(0.95); }
  }

  @keyframes scatter {
    0%   { opacity: 1; transform: translate(-50%, -50%); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))); }
  }

  @media (max-width: 560px) {
    #cat-scene { height: 104px; }
    #cat, .cat-svg { width: 104px; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, h1, p, .rule, .contact, .play-bar { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="paint" aria-hidden="true"></canvas>

  <main class="card">
    <img class="logo" src="imgs/otto_logo_enhanced_transparent.png" alt="Otto">
    <h1>We will get back to you soon</h1>
    <p>Thanks for reaching out. Someone from our team is on it and will be in touch shortly.</p>
    <div class="rule"></div>

    <section class="contact">
      <h2>Contact us</h2>
      <ul>
        <li>
          <a href="tel:+15551234567">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.6 1 1 0 0 1-.25 1z"/>
            </svg>
            <span>+1 (555) 123-4567</span>
          </a>
        </li>
        <li>
          <a href="mailto:hello@ottomedia.example">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="m3.5 6.5 8.5 6 8.5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>hello@ottomedia.example</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="play-bar">
      <ul>
        <li><button type="button" data-act="feed">🐟 Feed</button></li>
        <li><button type="button" data-act="toy" aria-pressed="false">🧶 String toy</button></li>
        <li><button type="button" data-act="pet">🤚 Pet</button></li>
      </ul>
      <p class="hint" id="hint" role="status">Otto is wandering about down there.</p>
    </section>
  </main>


  <div id="cat-scene">
    <div id="bowl" aria-hidden="true">
      <svg viewBox="0 0 58 26">
        <ellipse class="kibble" cx="21" cy="12" rx="5" ry="4"/>
        <ellipse class="kibble" cx="31" cy="10" rx="5.5" ry="4.5"/>
        <ellipse class="kibble" cx="39" cy="13" rx="4.5" ry="3.5"/>
        <path class="bowl-body" d="M7 13h44l-5 12a2 2 0 0 1-2 1H14a2 2 0 0 1-2-1z"/>
        <rect class="bowl-rim" x="4" y="10" width="50" height="6" rx="3"/>
      </svg>
    </div>

    <div id="cat" role="img" aria-label="Otto the cat">
      <div class="cat-flip">
        <div class="cat-bob">
          <svg class="cat-svg" viewBox="0 0 150 116">
            <ellipse class="shade" cx="78" cy="110" rx="48" ry="6"/>

            <path class="tail" d="M108 74c26 2 30-22 17-33"/>

            <rect class="leg leg-b1" x="95" y="76" width="14" height="28" rx="7"/>
            <rect class="leg leg-b2" x="80" y="78" width="14" height="26" rx="7"/>

            <ellipse class="body" cx="74" cy="60" rx="41" ry="27"/>
            <path class="stripe" d="M70 36c4 5 4 9 0 14"/>
            <path class="stripe" d="M84 38c4 5 4 9 0 14"/>
            <path class="stripe" d="M98 44c3 4 3 7 0 11"/>
            <ellipse class="belly" cx="68" cy="73" rx="27" ry="13"/>

            <rect class="leg leg-f1" x="48" y="76" width="14" height="28" rx="7"/>
            <rect class="leg leg-f2" x="33" y="78" width="14" height="26" rx="7"/>

            <g class="head">
              <path class="ear" d="M18 28 15 2l22 14z"/>
              <path class="ear" d="M41 16 57 1l4 24z"/>
              <path class="ear-in" d="M22 25 20 9l13 8z"/>
              <path class="ear-in" d="M44 17 55 7l3 14z"/>
              <circle class="head-shape" cx="37" cy="41" r="24"/>

              <g class="eye">
                <ellipse class="eye-white" cx="27" cy="38" rx="5.4" ry="6.4"/>
                <circle class="pupil" cx="27" cy="38" r="2.7"/>
                <circle class="glint" cx="28.4" cy="35.8" r="1.1"/>
              </g>
              <g class="eye">
                <ellipse class="eye-white" cx="47" cy="38" rx="5.4" ry="6.4"/>
                <circle class="pupil" cx="47" cy="38" r="2.7"/>
                <circle class="glint" cx="48.4" cy="35.8" r="1.1"/>
              </g>
              <path class="eye-shut" d="M22 39q5 4.5 10 0"/>
              <path class="eye-shut" d="M42 39q5 4.5 10 0"/>

              <path class="nose" d="M34 48h6l-3 3.4z"/>
              <path class="mouth" d="M37 51.4v2.4M37 53.8q-3.6 3-7 0M37 53.8q3.6 3 7 0"/>
              <g class="whiskers">
                <path d="M30 51 12 47M30 54 11 54M44 51 62 47M44 54 63 54"/>
              </g>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <svg id="toy" aria-hidden="true" hidden>
    <line id="toy-string" x1="0" y1="0" x2="0" y2="0"/>
    <circle class="ball" cx="0" cy="0" r="9"/>
    <circle class="ball-hi" cx="0" cy="0" r="3"/>
  </svg>

  <div id="fx" aria-hidden="true"></div>

  <script>
    (function () {
      var cat = document.getElementById("cat");
      var flip = cat.querySelector(".cat-flip");
      var eyes = cat.querySelectorAll(".pupil, .glint");
      var bowl = document.getElementById("bowl");
      var toy = document.getElementById("toy");
      var cord = document.getElementById("toy-string");
      var balls = toy.querySelectorAll(".ball, .ball-hi");
      var fx = document.getElementById("fx");
      var hint = document.getElementById("hint");

      var HALF = 66;                 // half the cat's width
      var SPEED = { walk: 0.075, food: 0.15, chase: 0.26 };

      var x = window.innerWidth / 2; // where the cat is, by its centre
      var goal = x;
      var facing = 1;                // 1 faces left, as drawn; -1 faces right
      var mode = "idle";
      var until = 0;                 // when the current activity ends
      var wanderAt = 0;
      var poked = performance.now(); // last time a person did anything
      var pouncedAt = 0;
      var heartAt = 0;
      var zzzAt = 0;
      var blinkAt = 0;
      var look = { x: x, y: 0 };

      var ball = { x: x, y: -100, vx: 0, vy: 0 };
      var bowlX = 0;
      var petting = false;

      function say(t) { hint.textContent = t; }
      function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
      function lo() { return HALF + 8; }
      function hi() { return Math.max(lo() + 1, window.innerWidth - HALF - 8); }
      function floor() { return window.innerHeight; }
      function headY() { return floor() - 88; }

      // --- little flourishes -------------------------------------------------

      function bit(px, py, kind, text) {
        var e = document.createElement("span");
        e.className = "bit " + kind;
        if (text) e.textContent = text;
        e.style.left = px + "px";
        e.style.top = py + "px";
        e.style.setProperty("--dx", ((Math.random() - 0.5) * 34).toFixed(1) + "px");
        if (kind === "crumb" || kind === "spark") {
          e.style.setProperty("--dy", (-14 - Math.random() * 22).toFixed(1) + "px");
        }
        fx.appendChild(e);
        e.addEventListener("animationend", function () { e.remove(); });
      }

      function hearts(n, px, py) {
        for (var i = 0; i < n; i++) {
          setTimeout(function () {
            bit(px + (Math.random() - 0.5) * 30, py + (Math.random() - 0.5) * 14, "heart", "♥");
          }, i * 130);
        }
      }

      function sparks(px, py) {
        for (var i = 0; i < 7; i++) bit(px, py, "spark");
      }

      // --- state -------------------------------------------------------------

      function wake() {
        poked = performance.now();
        if (mode === "sleep") { mode = "idle"; cat.classList.remove("sleep", "shut"); }
      }

      function setMode(next) {
        cat.classList.remove("walk", "eat", "pet", "play", "sleep", "shut");
        mode = next;
        if (next === "play") cat.classList.add("play");
      }

      function feed() {
        wake();
        if (mode === "feed") { hearts(1, x, headY()); return; }   // already eating
        bowlX = clamp(x + (Math.random() < 0.5 ? -1 : 1) * (150 + Math.random() * 180), lo(), hi());
        bowl.style.left = bowlX + "px";
        bowl.classList.add("out");
        setMode("feed");
        goal = bowlX + (x > bowlX ? 52 : -52);
        say("Dinner is served.");
      }

      function pet(seconds) {
        wake();
        setMode("pet");
        cat.classList.add("pet", "shut");
        until = performance.now() + seconds * 1000;
        goal = x;
        say("Otto is purring.");
      }

      function toggleToy(on) {
        wake();
        if (on) {
          toy.hidden = false;
          ball.x = look.x;
          ball.y = look.y + 90;
          setMode("play");
          say("Dangle it around - Otto will chase.");
        } else {
          toy.hidden = true;
          if (mode === "play") setMode("idle");
          say("Otto is wandering about down there.");
        }
      }

      // --- the loop ----------------------------------------------------------

      var prev = performance.now();

      function tick(now) {
        var dt = Math.min(now - prev, 48);
        prev = now;

        // String toy: the ball hangs below the pointer and swings on its cord.
        if (!toy.hidden) {
          ball.vx += (look.x - ball.x) * 0.055;
          ball.vy += (look.y + 96 - ball.y) * 0.055 + 0.55;
          ball.vx *= 0.9;
          ball.vy *= 0.9;
          ball.x += ball.vx;
          ball.y += ball.vy;

          cord.setAttribute("x1", look.x);
          cord.setAttribute("y1", look.y);
          cord.setAttribute("x2", ball.x);
          cord.setAttribute("y2", ball.y);
          for (var b = 0; b < balls.length; b++) {
            balls[b].setAttribute("cx", ball.x);
            balls[b].setAttribute("cy", ball.y);
          }
        }

        // What is the cat up to?
        var speed = SPEED.walk;

        if (mode === "play") {
          goal = clamp(ball.x, lo(), hi());
          speed = SPEED.chase;

          var near = Math.abs(ball.x - x) < 80 && ball.y > floor() - 190;
          if (near && now - pouncedAt > 1300) {
            pouncedAt = now;
            cat.classList.add("pounce");
            setTimeout(function () { cat.classList.remove("pounce"); }, 540);
            setTimeout(function () {
              sparks(ball.x, ball.y);
              ball.vx += (Math.random() - 0.5) * 26;
              ball.vy -= 9;
            }, 230);
          }
        } else if (mode === "feed") {
          speed = SPEED.food;
          if (!cat.classList.contains("eat") && Math.abs(goal - x) < 7) {
            cat.classList.add("eat");
            facing = bowlX < x ? 1 : -1;
            until = now + 4600;
            say("Crunch crunch crunch.");
          }
          if (cat.classList.contains("eat")) {
            if (Math.random() < 0.3) bit(bowlX + (Math.random() - 0.5) * 26, floor() - 16, "crumb");
            if (now > until) {
              cat.classList.remove("eat");
              bowl.classList.remove("out");
              hearts(3, x, headY());
              setMode("idle");
              say("Otto says thanks.");
            }
          }
        } else if (mode === "pet") {
          if (now - heartAt > 460) { heartAt = now; hearts(1, x, headY()); }
          if (now > until && !petting) { setMode("idle"); say("Otto wants more."); }
        } else if (mode === "sleep") {
          if (now - zzzAt > 1500) {
            zzzAt = now;
            bit(x - facing * 40, headY() - 16, "zzz", "z");
          }
        } else {
          // Idle: pick somewhere new to amble to now and then, and nod off
          // if nobody has bothered him for a while.
          if (now > wanderAt) {
            wanderAt = now + 3600 + Math.random() * 5200;
            goal = lo() + Math.random() * (hi() - lo());
          }
          if (now - poked > 24000) {
            setMode("sleep");
            cat.classList.add("sleep", "shut");
            say("Otto is having a nap.");
          }
        }

        // Walk toward the goal.
        var dx = goal - x;
        var moving = Math.abs(dx) > 6 && mode !== "pet" && mode !== "sleep" &&
                     !cat.classList.contains("eat");

        if (moving) {
          x += (dx > 0 ? 1 : -1) * Math.min(speed * dt, Math.abs(dx));
          facing = dx > 0 ? -1 : 1;
        }
        cat.classList.toggle("walk", moving);

        // Blink, unless the eyes are already shut.
        if (!cat.classList.contains("shut") && now > blinkAt) {
          blinkAt = now + 2200 + Math.random() * 4200;
          cat.classList.add("shut");
          setTimeout(function () {
            if (mode !== "pet" && mode !== "sleep") cat.classList.remove("shut");
          }, 130);
        }

        // Follow whatever is interesting with the eyes.
        var watch = mode === "play" ? ball : (mode === "feed" ? { x: bowlX, y: floor() } : look);
        var ex = clamp((watch.x - x) / 90, -1, 1) * 2.4 * -facing;
        var ey = clamp((watch.y - headY()) / 90, -1, 1) * 1.9;
        for (var e = 0; e < eyes.length; e++) {
          eyes[e].style.transform = "translate(" + ex.toFixed(2) + "px," + ey.toFixed(2) + "px)";
        }

        cat.style.transform = "translateX(" + (x - HALF) + "px)";
        flip.style.transform = "scaleX(" + facing + ")";

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);

      // --- input -------------------------------------------------------------

      window.addEventListener("pointermove", function (e) {
        look.x = e.clientX;
        look.y = e.clientY;
      }, { passive: true });

      document.querySelectorAll(".play-bar button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var act = btn.dataset.act;
          if (act === "feed") feed();
          if (act === "pet") pet(4);
          if (act === "toy") {
            var on = btn.getAttribute("aria-pressed") !== "true";
            btn.setAttribute("aria-pressed", on ? "true" : "false");
            toggleToy(on);
          }
        });
      });

      // Stroking him directly: press and drag across the cat.
      cat.addEventListener("pointerdown", function (e) {
        petting = true;
        cat.setPointerCapture(e.pointerId);
        pet(4);
      });

      cat.addEventListener("pointermove", function () {
        if (petting && performance.now() - heartAt > 300) {
          heartAt = performance.now();
          hearts(1, x, headY());
        }
      });

      function stop() {
        if (!petting) return;
        petting = false;
        until = performance.now() + 900;
      }
      cat.addEventListener("pointerup", stop);
      cat.addEventListener("pointercancel", stop);

      function fit() {
        toy.setAttribute("width", window.innerWidth);
        toy.setAttribute("height", window.innerHeight);
        x = clamp(x, lo(), hi());
        goal = clamp(goal, lo(), hi());
      }
      window.addEventListener("resize", fit);
      fit();
    })();
