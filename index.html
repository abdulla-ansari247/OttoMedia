<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otto Media · Coming Soon</title>
<meta name="description" content="Otto Media — a new home for creators and hospitality. Dubai, UAE.">
<link rel="icon" href="imgs/otto-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111111;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --line: #2e2e2e;
    --pad: clamp(24px, 6vw, 76px);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  .label {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
  }

  header {
    display: flex;
    justify-content: space-between;
    padding: 36px var(--pad) 0;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    text-align: center;
    animation: rise 1s ease-out both;
  }

  .logo {
    display: block;
    width: min(262px, 60vw);
    height: auto;
    /* Source logo is black on transparent; flip it to white. */
    filter: invert(1);
  }

  h1 { margin: 0; }

  .wordmark {
    display: block;
    margin: 22px 0 0;
    font-size: clamp(22px, 3.2vw, 28px);
    font-weight: 400;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    /* Offset trailing letter-spacing so it stays visually centred. */
    padding-left: 0.42em;
  }

  .rule {
    width: 44px;
    height: 1px;
    margin: 36px auto;
    background: #4a4a4a;
    border: 0;
  }

  .tagline {
    margin: 0;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 300;
  }

  form {
    display: flex;
    align-items: center;
    width: min(408px, 100%);
    margin-top: 44px;
    border-bottom: 1px solid #444;
    transition: border-color 0.2s ease;
  }

  form:focus-within { border-color: var(--ink); }

  input[type="email"] {
    flex: 1;
    min-width: 0;
    padding: 14px 4px;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
  }

  input::placeholder { color: var(--muted); }

  button {
    padding: 14px 8px;
    background: none;
    border: 0;
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  button:hover { opacity: 0.7; }

  .status {
    min-height: 20px;
    margin: 14px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  footer {
    margin: 0 var(--pad);
    padding: 28px 0 36px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px 36px;
  }

  footer a {
    color: #c9c9c9;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  footer a:hover { color: var(--ink); }

  .hidden { display: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <span class="label">Dubai · UAE</span>
    <span class="label">Coming Soon</span>
  </header>

  <main>
    <h1>
      <img class="logo" src="imgs/otto-logo.png" alt="OTTO">
      <span class="wordmark">Media</span>
    </h1>

    <hr class="rule">

    <p class="tagline">A new home for creators and hospitality.</p>

    <!-- Netlify Forms picks this up automatically; submissions appear in the Netlify dashboard. -->
    <form name="launch-news" method="POST" data-netlify="true" netlify-honeypot="company">
      <input type="hidden" name="form-name" value="launch-news">
      <p class="hidden"><label>Leave empty <input name="company"></label></p>
      <input type="email" name="email" placeholder="Your email for launch news" aria-label="Email address" required>
      <button type="submit">Notify me</button>
    </form>
    <p class="status" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <a href="mailto:info@ottomedia.ae">info@ottomedia.ae</a>
    <a href="tel:+971523848135">+971 52 384 8135</a>
    <!-- TODO: replace HANDLE with the real Instagram username. -->
    <a href="https://instagram.com/HANDLE" target="_blank" rel="noopener">Instagram @HANDLE</a>
  </footer>

<script>
  const form = document.querySelector("form");
  const status = document.querySelector(".status");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    status.textContent = "Sending…";
    try {
      const res = await fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(new FormData(form)).toString(),
      });
      if (!res.ok) throw new Error(res.status);
      form.reset();
      status.textContent = "Thank you — we'll be in touch at launch.";
    } catch {
      status.textContent = "Something went wrong. Email us at info@ottomedia.ae instead.";
    }
  });
</script>
</body>
</html>
